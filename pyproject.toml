[project]
name = "fast-api-starter-template"
version = "0.1.0"
description = "Project FastAPI template with some configurations already made and authentication implemented, to be used as a basis for other projects"
authors = [
    { name = "Juliana Marques", email = "julianabmarques@live.com" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg (>=3.3.4,<4.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pylint = "^4.0.6"
flake8 = "^7.3.0"
pytest = "^9.1.1"
httpx2 = "^2.5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
